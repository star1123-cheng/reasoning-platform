<script>

const KP=['ABC','DEF','GHI','JKL','MNO','PQRS','TUV','WXYZ'],PT=A.replace('K',''),BK='Apple Bird Cat Door Egg Fish Gold Hat Ink Jar Key Lamp Moon Nest Owl Pen Queen Rain Star Tree Umbrella Voice Wolf Xray Yarn Zoo'.split(' '),G6='NA1C3H8TB2OME5WRPD4F6G7I9J0KLQSUVXYZ',AD='ADFGVX';

{n:'凱撒密碼',lv:1,d:'每個字母往後平移固定位數。',p:[{k:'n',l:'位移數',t:'number',v:3}],run:(s,p)=>{const n=(((+p.n||0)%26)+26)%26,m=i=>A[(i+n)%26];return{t:L(s,m),h:'每個字母都被換成對照表下方的字母：'+alpha([...A].map((_,i)=>m(i))),a:'位移 '+n}}},

{n:'木棒密碼',lv:2,d:'把文字繞在木棒上，換個方向讀。',p:[{k:'c',l:'每圈字數（2–12）',t:'number',v:4}],run:(s,p)=>{const c=Math.min(12,Math.max(2,+p.c||4));let t=W(s,x=>x).join('');while(t.length%c)t+='X';const r=t.length/c;let o='';for(let k=0;k<c;k++)for(let j=0;j<r;j++)o+=t[j*c+k];return{t:o,h:`每 ${r} 個字母排成一直行，由上往下填滿一行後換下一行，最後橫著讀。結尾的 X 是補位字母。`,a:'每圈 '+c+' 字，補 X 至 '+t.length+' 字'}}},

$('#cv').onclick=e=>{const x=CH[cc],id=e.target.id;if(id=='ck'){const a=$('#ca').value.toLowerCase().replace(/\s+/g,' ').trim();if(a&&x.k.some(k=>a.includes(k))){solved.add(cc);show();cases();$('#cr').innerHTML='<b>破案！</b>'+x.e}else $('#cr').textContent='還差一點，再想想線索。'}else if(id=='chn')$('#cr').textContent='提示：'+x.h;else if(id=='cs')$('#cr').textContent='解答：'+x.e};
const tab=b=>{const n=b.dataset.t;$('#pc').hidden=n!='c';$('#pch').hidden=n!='h';document.querySelectorAll('.tabs button').forEach(t=>{t.setAttribute('aria-selected',t==b);t.tabIndex=t==b?0:-1});if(n=='h'){cases();show()}};
$('.tabs').onclick=e=>{const b=e.target.closest('button');if(b&&!b.disabled)tab(b)};
// 分頁用左右鍵切換（WAI-ARIA tabs 慣例）
$('.tabs').onkeydown=e=>{if(e.key!='ArrowLeft'&&e.key!='ArrowRight')return;const ts=[...document.querySelectorAll('.tabs button:not(:disabled)')],i=ts.indexOf(document.activeElement),b=ts[(i+(e.key=='ArrowRight'?1:-1)+ts.length)%ts.length];tab(b);b.focus()};
draw();
</script></body></html>
